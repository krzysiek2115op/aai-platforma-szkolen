name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN tylko do odczytu — żaden job nie pisze do repo
permissions:
  contents: read

jobs:
  straznicy:
    name: Strażnicy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Runner sam znajduje wszystkich strażników (straznik-*.mjs) —
      # nowego strażnika nie da się „zapomnieć podpiąć".
      - name: Uruchom strażników
        run: node tools/straznicy/uruchom-wszystkie.mjs

  aplikacja:
    name: Kod aplikacji (lint → tsc → build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Kontrola typów
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Testy (npm test) wejdą tu od Działu 2 — pilnuje straznik-ci:
      # gdy package.json dostanie skrypt "test", CI musi go uruchamiać.

  security:
    name: Skan sekretów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pełna historia — gitleaks skanuje wszystkie commity
          fetch-depth: 0

      # Binarka MIT zamiast gitleaks-action (licencja komercyjna od v2,
      # odpytuje zewnętrzny serwis). Wersja przypięta + SHA-256 —
      # ta sama praktyka co w repo matthewplugins.pl.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # --redact: znaleziony sekret nie trafia jawnie do logów builda
          ./gitleaks git --no-banner --redact --exit-code 1 .
          rm -f gitleaks gitleaks.tar.gz
