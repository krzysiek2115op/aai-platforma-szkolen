name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN tylko do odczytu — żaden job nie pisze do repo
permissions:
  contents: read

jobs:
  straznicy:
    name: Strażnicy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Runner sam znajduje wszystkich strażników (straznik-*.mjs) —
      # nowego strażnika nie da się „zapomnieć podpiąć".
      - name: Uruchom strażników
        run: node tools/straznicy/uruchom-wszystkie.mjs

  aplikacja:
    name: Kod aplikacji (lint → tsc → build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Kontrola typów
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  baza:
    name: Baza db1_kursy (migracje + triggery + goldeny)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kursy
          POSTGRES_PASSWORD: kursy-dev
          POSTGRES_DB: db1_kursy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kursy -d db1_kursy"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DB1_URL: postgres://kursy:kursy-dev@localhost:5432/db1_kursy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      # Dowód B2: migracje od zera, audyt triggerów, golden schematu.
      - name: Testy modułów
        run: npm test

      # Dowód B4: produkcyjny serwer renderuje katalog Z BAZY (golden HTML).
      - name: Build pod smoke
        run: npm run build

      - name: Smoke katalogu /szkolenia
        run: node tools/smoke/smoke-d4.ts

      # Dowód B5: pełna strona sprzedażowa z bazy (golden sekcji programu).
      - name: Smoke strony sprzedażowej /szkolenia/[slug]
        run: node tools/smoke/smoke-d5.ts

  security:
    name: Skan sekretów
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pełna historia — gitleaks skanuje wszystkie commity
          fetch-depth: 0

      # Binarka MIT zamiast gitleaks-action (licencja komercyjna od v2,
      # odpytuje zewnętrzny serwis). Wersja przypięta + SHA-256 —
      # ta sama praktyka co w repo matthewplugins.pl.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # --redact: znaleziony sekret nie trafia jawnie do logów builda
          ./gitleaks git --no-banner --redact --exit-code 1 .
          rm -f gitleaks gitleaks.tar.gz
